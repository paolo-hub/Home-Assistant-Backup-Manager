# Home Assistant Backup Manager 3.0 development / BMA 1.1.0
# Install alongside legacy under a DIFFERENT filename: pkg_bma_backup.yaml.
# Configure provider agent_id values below using BMA list_agents.
# Empty provider IDs intentionally fail closed when selected.
# Do not enable real retention or schedules before the approved E2E.
homeassistant:
  customize:
    input_boolean.bma_backup_destination_full_local: &id001
      agent_id: hassio.local
    input_boolean.bma_backup_destination_full_network: &id002
      agent_id: ''
    input_boolean.bma_backup_destination_full_google_drive: &id003
      agent_id: ''
    input_boolean.bma_backup_destination_full_s3: &id004
      agent_id: ''
    input_boolean.bma_backup_destination_partial_local: *id001
    input_boolean.bma_backup_destination_partial_network: *id002
    input_boolean.bma_backup_destination_partial_google_drive: *id003
    input_boolean.bma_backup_destination_partial_s3: *id004
    input_boolean.bma_backup_destination_ha_native_local: *id001
    input_boolean.bma_backup_destination_ha_native_network: *id002
    input_boolean.bma_backup_destination_ha_native_google_drive: *id003
    input_boolean.bma_backup_destination_ha_native_s3: *id004
    input_boolean.bma_backup_destination_app_update_local: *id001
    input_boolean.bma_backup_destination_app_update_network: *id002
    input_boolean.bma_backup_destination_app_update_google_drive: *id003
    input_boolean.bma_backup_destination_app_update_s3: *id004
input_boolean:
  bma_backup_initialized:
    name: BMA Backup initialized
  bma_backup_apply_unlocked:
    name: BMA Backup allow real retention this session
    initial: false
  bma_backup_use_password:
    name: BMA Backup use password
  bma_backup_notify_external:
    name: BMA Backup notify HA native
  bma_backup_notify_app_update:
    name: BMA Backup notify app updates
  bma_backup_notify_unknown:
    name: BMA Backup notify unknown events
  bma_backup_notify_pushover:
    name: BMA Backup Pushover notifications
  bma_backup_full_retention_enabled:
    name: BMA Backup full automatic retention
  bma_backup_destination_full_local:
    name: BMA Backup full destination Local
  bma_backup_destination_full_network:
    name: BMA Backup full destination SMB / Network
  bma_backup_destination_full_google_drive:
    name: BMA Backup full destination Google Drive
  bma_backup_destination_full_s3:
    name: BMA Backup full destination S3 Compatible
  bma_backup_partial_retention_enabled:
    name: BMA Backup partial automatic retention
  bma_backup_destination_partial_local:
    name: BMA Backup partial destination Local
  bma_backup_destination_partial_network:
    name: BMA Backup partial destination SMB / Network
  bma_backup_destination_partial_google_drive:
    name: BMA Backup partial destination Google Drive
  bma_backup_destination_partial_s3:
    name: BMA Backup partial destination S3 Compatible
  bma_backup_ha_native_retention_enabled:
    name: BMA Backup ha_native automatic retention
  bma_backup_destination_ha_native_local:
    name: BMA Backup ha_native destination Local
  bma_backup_destination_ha_native_network:
    name: BMA Backup ha_native destination SMB / Network
  bma_backup_destination_ha_native_google_drive:
    name: BMA Backup ha_native destination Google Drive
  bma_backup_destination_ha_native_s3:
    name: BMA Backup ha_native destination S3 Compatible
  bma_backup_app_update_retention_enabled:
    name: BMA Backup app_update automatic retention
  bma_backup_destination_app_update_local:
    name: BMA Backup app_update destination Local
  bma_backup_destination_app_update_network:
    name: BMA Backup app_update destination SMB / Network
  bma_backup_destination_app_update_google_drive:
    name: BMA Backup app_update destination Google Drive
  bma_backup_destination_app_update_s3:
    name: BMA Backup app_update destination S3 Compatible
  bma_backup_full_enabled:
    name: BMA Backup full schedule enabled
  bma_backup_full_include_homeassistant:
    name: BMA Backup full include Home Assistant
  bma_backup_full_include_database:
    name: BMA Backup full include Database
  bma_backup_full_include_apps:
    name: BMA Backup full include Apps / Add-ons
  bma_backup_full_include_local_addons:
    name: BMA Backup full include Local add-ons folder
  bma_backup_full_include_media:
    name: BMA Backup full include Media folder
  bma_backup_full_include_share:
    name: BMA Backup full include Share folder
  bma_backup_full_include_ssl:
    name: BMA Backup full include SSL folder
  bma_backup_partial_enabled:
    name: BMA Backup partial schedule enabled
  bma_backup_partial_include_homeassistant:
    name: BMA Backup partial include Home Assistant
  bma_backup_partial_include_database:
    name: BMA Backup partial include Database
  bma_backup_partial_include_apps:
    name: BMA Backup partial include Apps / Add-ons
  bma_backup_partial_include_local_addons:
    name: BMA Backup partial include Local add-ons folder
  bma_backup_partial_include_media:
    name: BMA Backup partial include Media folder
  bma_backup_partial_include_share:
    name: BMA Backup partial include Share folder
  bma_backup_partial_include_ssl:
    name: BMA Backup partial include SSL folder
input_number:
  bma_backup_full_keep_last:
    name: BMA Backup full keep last
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_full_daily:
    name: BMA Backup full daily
    min: 0
    max: 365
    step: 1
    mode: box
  bma_backup_full_weekly:
    name: BMA Backup full weekly
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_full_monthly:
    name: BMA Backup full monthly
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_full_yearly:
    name: BMA Backup full yearly
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_partial_keep_last:
    name: BMA Backup partial keep last
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_partial_daily:
    name: BMA Backup partial daily
    min: 0
    max: 365
    step: 1
    mode: box
  bma_backup_partial_weekly:
    name: BMA Backup partial weekly
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_partial_monthly:
    name: BMA Backup partial monthly
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_partial_yearly:
    name: BMA Backup partial yearly
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_ha_native_keep_last:
    name: BMA Backup ha_native keep last
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_ha_native_daily:
    name: BMA Backup ha_native daily
    min: 0
    max: 365
    step: 1
    mode: box
  bma_backup_ha_native_weekly:
    name: BMA Backup ha_native weekly
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_ha_native_monthly:
    name: BMA Backup ha_native monthly
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_ha_native_yearly:
    name: BMA Backup ha_native yearly
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_app_update_keep_last:
    name: BMA Backup app_update keep last
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_app_update_daily:
    name: BMA Backup app_update daily
    min: 0
    max: 365
    step: 1
    mode: box
  bma_backup_app_update_weekly:
    name: BMA Backup app_update weekly
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_app_update_monthly:
    name: BMA Backup app_update monthly
    min: 0
    max: 100
    step: 1
    mode: box
  bma_backup_app_update_yearly:
    name: BMA Backup app_update yearly
    min: 0
    max: 100
    step: 1
    mode: box
input_select:
  bma_backup_full_days:
    name: BMA Backup full days
    options:
      - Never
      - Every day
      - Mon - Wed - Fri
      - Mon and Fri
      - Saturday
      - Sunday
  bma_backup_partial_days:
    name: BMA Backup partial days
    options:
      - Never
      - Every day
      - Mon - Wed - Fri
      - Mon and Fri
      - Saturday
      - Sunday
  bma_backup_retention_profile:
    name: BMA Backup retention profile
    options:
      - full
      - partial
      - ha_native
      - app_update
input_datetime:
  bma_backup_full_time:
    name: BMA Backup full time
    has_date: false
    has_time: true
  bma_backup_partial_time:
    name: BMA Backup partial time
    has_date: false
    has_time: true
script:
  bma_backup_initialize:
    alias: BMA Backup initialize once
    mode: single
    sequence:
      - condition: template
        value_template: '{{ is_state(''input_boolean.bma_backup_initialized'', ''off'') }}'
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.bma_backup_full_include_homeassistant
            - input_boolean.bma_backup_full_include_database
            - input_boolean.bma_backup_full_include_apps
            - input_boolean.bma_backup_full_include_local_addons
            - input_boolean.bma_backup_full_include_media
            - input_boolean.bma_backup_full_include_share
            - input_boolean.bma_backup_full_include_ssl
            - input_boolean.bma_backup_partial_include_homeassistant
            - input_boolean.bma_backup_partial_include_database
            - input_boolean.bma_backup_destination_full_local
            - input_boolean.bma_backup_destination_partial_local
            - input_boolean.bma_backup_notify_external
            - input_boolean.bma_backup_notify_pushover
      - action: input_number.set_value
        target:
          entity_id: input_number.bma_backup_full_keep_last
        data:
          value: 3
      - action: input_number.set_value
        target:
          entity_id: input_number.bma_backup_partial_keep_last
        data:
          value: 3
      - action: input_number.set_value
        target:
          entity_id: input_number.bma_backup_ha_native_keep_last
        data:
          value: 3
      - action: input_number.set_value
        target:
          entity_id: input_number.bma_backup_app_update_keep_last
        data:
          value: 3
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.bma_backup_full_time
        data:
          time: 03:00:00
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.bma_backup_partial_time
        data:
          time: 04:00:00
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bma_backup_initialized
  bma_backup_notify:
    alias: BMA Backup notify
    mode: parallel
    max: 10
    fields:
      message:
        required: true
        selector:
          text: {}
    sequence:
      - action: persistent_notification.create
        data:
          title: Home Assistant Backup Manager 3.0
          message: '{{ message }}'
          notification_id: bma_backup_notice
        continue_on_error: true
      - if: '{{ is_state(''input_boolean.bma_backup_notify_pushover'', ''on'') }}'
        then:
          - action: notify.pushover_hassio
            data:
              title: Home Assistant Backup Manager 3.0
              message: '{{ message }}'
            continue_on_error: true
  bma_backup_resolve_destinations:
    alias: BMA Backup resolve destinations
    mode: parallel
    max: 10
    sequence:
      - variables:
          result: |-
            {% set ns = namespace(ids=[], bad=[]) %}
            {% set entries = states.input_boolean | selectattr('entity_id', 'match', '^input_boolean.bma_backup_destination_' ~ job ~ '_') | list %}
            {% for item in entries %}
              {% if item.state not in ['on', 'off'] %}{% set ns.bad = ns.bad + [item.entity_id] %}
              {% elif item.state == 'on' %}
                {% set agent = item.attributes.get('agent_id') %}
                {% if agent is string and agent | trim | length > 0 %}{% set ns.ids = ns.ids + [agent | trim] %}
                {% else %}{% set ns.bad = ns.bad + [item.entity_id] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ dict(agent_ids=ns.ids | unique | list | sort, invalid=ns.bad, selector_count=entries | length) }}
      - stop: Resolved destination selectors
        response_variable: result
  bma_backup_run_full:
    alias: BMA Backup run full
    mode: single
    sequence:
      - action: script.bma_backup_worker
        data:
          operation: create
          job: full
  bma_backup_run_partial:
    alias: BMA Backup run partial
    mode: single
    sequence:
      - action: script.bma_backup_worker
        data:
          operation: create
          job: partial
  bma_backup_plan_retention:
    alias: BMA Backup plan retention
    mode: single
    sequence:
      - action: script.bma_backup_worker
        data:
          operation: plan
          job: '{{ states(''input_select.bma_backup_retention_profile'') }}'
  bma_backup_apply_retention:
    alias: BMA Backup apply retention
    mode: single
    sequence:
      - action: script.bma_backup_worker
        data:
          operation: apply
          job: '{{ states(''input_select.bma_backup_retention_profile'') }}'
  bma_backup_worker:
    alias: BMA Backup serialized worker
    description: Internal worker; all package create and retention operations share this queue.
    mode: queued
    max: 10
    trace:
      stored_traces: 0
    sequence:
      - variables:
          operation: '{{ operation | default(''invalid'') }}'
          job: '{{ job | default(''invalid'') }}'
          automatic: '{{ automatic | default(false) }}'
          event_agents: '{{ event_agents | default([]) }}'
          snapshot: {}
          result: {}
          destinations: {}
      - if: '{{ operation not in [''create'',''plan'',''apply''] or job not in [''full'',''partial'',''ha_native'',''app_update'']
          or (operation == ''create'' and job not in [''full'',''partial'']) }}'
        then:
          - action: script.bma_backup_notify
            data:
              message: Invalid operation or profile.
          - event: bma_backup_report
            event_data:
              kind: operation
              status: failed
              message: Invalid operation or profile.
          - stop: Invalid operation or profile.
            error: true
      - if: '{{ not is_state(''input_boolean.bma_backup_initialized'',''on'') }}'
        then:
          - action: script.bma_backup_notify
            data:
              message: Package not initialized. Run BMA Backup initialize once.
          - event: bma_backup_report
            event_data:
              kind: operation
              status: failed
              message: Package not initialized. Run BMA Backup initialize once.
          - stop: Package not initialized. Run BMA Backup initialize once.
            error: true
      - if: '{{ operation == ''apply'' and not is_state(''input_boolean.bma_backup_apply_unlocked'',''on'')
          }}'
        then:
          - action: script.bma_backup_notify
            data:
              message: Real retention is locked. No deletion requested.
          - event: bma_backup_report
            event_data:
              kind: operation
              status: failed
              message: Real retention is locked. No deletion requested.
          - stop: Real retention is locked. No deletion requested.
            error: true
      - if: '{{ automatic }}'
        then:
          - condition: template
            value_template: '{{ operation == ''apply'' and is_state(''input_boolean.bma_backup_'' ~ job ~ ''_retention_enabled'',''on'')
              }}'
      - action: script.bma_backup_resolve_destinations
        data:
          job: '{{ job }}'
        response_variable: destinations
      - if: '{{ destinations.invalid | length > 0 or destinations.agent_ids | length == 0 }}'
        then:
          - action: script.bma_backup_notify
            data:
              message: No valid destination selected, or a selector is unavailable/unmapped.
          - event: bma_backup_report
            event_data:
              kind: operation
              status: failed
              message: No valid destination selected, or a selector is unavailable/unmapped.
          - stop: No valid destination selected, or a selector is unavailable/unmapped.
            error: true
      - variables:
          agent_ids: '{{ destinations.agent_ids }}'
      - if: '{{ automatic and (agent_ids | reject(''in'', event_agents) | list | length > 0) }}'
        then:
          - action: script.bma_backup_notify
            data:
              message: 'Automatic retention skipped: selected scope includes a destination not confirmed by
                the new-backup event.'
          - event: bma_backup_report
            event_data:
              kind: operation
              status: failed
              message: 'Automatic retention skipped: selected scope includes a destination not confirmed by
                the new-backup event.'
          - stop: 'Automatic retention skipped: selected scope includes a destination not confirmed by the
              new-backup event.'
            error: true
      - action: backup_manager_actions.refresh
        response_variable: snapshot
        continue_on_error: true
      - if: '{{ snapshot is not mapping or snapshot.get(''agents'') is not mapping or snapshot.get(''agent_errors'')
          is not mapping or snapshot.get(''state'') != ''idle'' }}'
        then:
          - action: script.bma_backup_notify
            data:
              message: Backup Manager unavailable, busy, or returned an invalid response. Inspect BMA logs.
          - event: bma_backup_report
            event_data:
              kind: operation
              status: failed
              message: Backup Manager unavailable, busy, or returned an invalid response. Inspect BMA logs.
          - stop: Backup Manager unavailable, busy, or returned an invalid response. Inspect BMA logs.
            error: true
      - if: '{{ agent_ids | reject(''in'', snapshot.agents) | list | length > 0 or agent_ids | select(''in'',
          snapshot.agent_errors) | list | length > 0 }}'
        then:
          - action: script.bma_backup_notify
            data:
              message: A selected backup agent is absent or has an inventory error. No operation requested.
          - event: bma_backup_report
            event_data:
              kind: operation
              status: failed
              message: A selected backup agent is absent or has an inventory error. No operation requested.
          - stop: A selected backup agent is absent or has an inventory error. No operation requested.
            error: true
      - event: bma_backup_report
        event_data:
          kind: operation
          status: running
          message: '{{ operation ~ ": " ~ job }}'
      - choose:
          - conditions: '{{ operation == ''create'' }}'
            sequence:
              - if: '{{ states(''input_boolean.bma_backup_use_password'') not in [''on'',''off''] }}'
                then:
                  - action: script.bma_backup_notify
                    data:
                      message: Encryption selector is unavailable; refusing to create an unintentionally unencrypted
                        backup.
                  - event: bma_backup_report
                    event_data:
                      kind: operation
                      status: failed
                      message: Encryption selector is unavailable; refusing to create an unintentionally unencrypted
                        backup.
                  - stop: Encryption selector is unavailable; refusing to create an unintentionally unencrypted
                      backup.
                    error: true
              - if: |-
                  {% set ns=namespace(bad=false) %}{% for key in ['homeassistant','database','apps','local_addons','media','share','ssl'] %}
                  {% if states('input_boolean.bma_backup_' ~ job ~ '_include_' ~ key) not in ['on','off'] %}{% set ns.bad=true %}{% endif %}{% endfor %}{{ ns.bad }}
                then:
                  - action: script.bma_backup_notify
                    data:
                      message: A content selector is unavailable.
                  - event: bma_backup_report
                    event_data:
                      kind: operation
                      status: failed
                      message: A content selector is unavailable.
                  - stop: A content selector is unavailable.
                    error: true
              - choose:
                  - conditions: '{{ is_state(''input_boolean.bma_backup_use_password'',''on'') }}'
                    sequence:
                      - action: backup_manager_actions.create
                        data:
                          agent_ids: '{{ agent_ids }}'
                          job_id: '{{ job }}'
                          name: BMA {{ job }} {{ now().strftime("%Y-%m-%d %H:%M:%S") }}
                          include_homeassistant: '{{ is_state(''input_boolean.bma_backup_'' ~ job ~ ''_include_homeassistant'',''on'')
                            }}'
                          include_database: '{{ is_state(''input_boolean.bma_backup_'' ~ job ~ ''_include_database'',''on'')
                            }}'
                          include_all_addons: '{{ is_state(''input_boolean.bma_backup_'' ~ job ~ ''_include_apps'',''on'')
                            }}'
                          include_folders: |-
                            {% set ns=namespace(folders=[]) %}
                            {% for key, folder in [('local_addons','addons/local'),('media','media'),('share','share'),('ssl','ssl')] %}
                            {% if is_state('input_boolean.bma_backup_' ~ job ~ '_include_' ~ key,'on') %}{% set ns.folders=ns.folders+[folder] %}{% endif %}
                            {% endfor %}{{ ns.folders }}
                          password: !secret ha_backup_password
                        response_variable: result
                        continue_on_error: true
                default:
                  - action: backup_manager_actions.create
                    data:
                      agent_ids: '{{ agent_ids }}'
                      job_id: '{{ job }}'
                      name: BMA {{ job }} {{ now().strftime("%Y-%m-%d %H:%M:%S") }}
                      include_homeassistant: '{{ is_state(''input_boolean.bma_backup_'' ~ job ~ ''_include_homeassistant'',''on'')
                        }}'
                      include_database: '{{ is_state(''input_boolean.bma_backup_'' ~ job ~ ''_include_database'',''on'')
                        }}'
                      include_all_addons: '{{ is_state(''input_boolean.bma_backup_'' ~ job ~ ''_include_apps'',''on'')
                        }}'
                      include_folders: |-
                        {% set ns=namespace(folders=[]) %}
                        {% for key, folder in [('local_addons','addons/local'),('media','media'),('share','share'),('ssl','ssl')] %}
                        {% if is_state('input_boolean.bma_backup_' ~ job ~ '_include_' ~ key,'on') %}{% set ns.folders=ns.folders+[folder] %}{% endif %}
                        {% endfor %}{{ ns.folders }}
                    response_variable: result
                    continue_on_error: true
              - if: '{{ result is not mapping or not result.get(''backup_id'') or result.get(''source_type'')
                  != ''bma'' or result.get(''job_id'') != job or result.get(''stored_agent_ids'') is not iterable
                  or result.get(''stored_agent_ids'') is string or (agent_ids | reject(''in'', result.get(''stored_agent_ids'',[]))
                  | list | length > 0) or result.get(''failed_agent_ids'', [''invalid'']) != [] or result.get(''failed_addons'',
                  [''invalid'']) != [] or result.get(''failed_folders'', [''invalid'']) != [] }}'
                then:
                  - action: script.bma_backup_notify
                    data:
                      message: Backup creation failed or could not be verified. Partial copies may exist. Inspect
                        BMA logs and inventory; no package retention follows a failed BMA create.
                  - event: bma_backup_report
                    event_data:
                      kind: operation
                      status: failed
                      message: Backup creation failed or could not be verified. Partial copies may exist. Inspect
                        BMA logs and inventory; no package retention follows a failed BMA create.
                  - stop: Backup creation failed or could not be verified. Partial copies may exist. Inspect
                      BMA logs and inventory; no package retention follows a failed BMA create.
                    error: true
              - action: script.bma_backup_notify
                data:
                  message: 'Backup {{ job }} completed: {{ result.name }} | {{ result.date }} | Confirmed destinations:
                    {{ result.stored_agent_ids | join(", ") }}. Retention, if enabled, is reported separately.'
              - event: bma_backup_report
                event_data:
                  kind: operation
                  status: success
                  message: '{{ "Verified " ~ job ~ " backup: " ~ result.backup_id }}'
        default:
          - variables:
              policy: |-
                {% set ns=namespace(values={}, valid=true) %}
                {% for key in ['keep_last','daily','weekly','monthly','yearly'] %}
                {% set value=states('input_number.bma_backup_' ~ job ~ '_' ~ key) %}
                {% if not is_number(value) or value | float < 0 or value | float != value | int %}{% set ns.valid=false %}{% endif %}
                {% set ns.values=dict(ns.values, **{key: value | int(0)}) %}
                {% endfor %}{{ dict(values=ns.values, valid=ns.valid) }}
          - if: '{{ not policy.valid or policy[''values''].values() | sum <= 0 }}'
            then:
              - action: script.bma_backup_notify
                data:
                  message: 'Invalid retention policy: use nonnegative integers and at least one positive counter.'
              - event: bma_backup_report
                event_data:
                  kind: operation
                  status: failed
                  message: 'Invalid retention policy: use nonnegative integers and at least one positive counter.'
              - stop: 'Invalid retention policy: use nonnegative integers and at least one positive counter.'
                error: true
          - variables:
              request: |-
                {% set base=dict(policy['values'], agent_ids=agent_ids, source_type=('bma' if job in ['full','partial'] else job)) %}
                {{ dict(base, job_id=job) if job in ['full','partial'] else dict(base, group_by='app') if job == 'app_update' else base }}
          - action: '{{ ''backup_manager_actions.plan_retention'' if operation == ''plan'' else ''backup_manager_actions.apply_retention''
              }}'
            data: '{{ request }}'
            response_variable: result
            continue_on_error: true
          - variables:
              plan: '{{ result.get(''plan'', {}) if operation == ''apply'' and result is mapping else result
                }}'
          - if: '{{ plan is not mapping or plan.get(''summary'') is not mapping or plan.get(''scope'') is not
              mapping or plan.get(''evaluated_at'') is not string }}'
            then:
              - action: script.bma_backup_notify
                data:
                  message: 'Retention failed or returned an invalid response. An apply may have stopped after
                    partial deletion: inspect BMA logs and current inventory.'
              - event: bma_backup_report
                event_data:
                  kind: operation
                  status: failed
                  message: 'Retention failed or returned an invalid response. An apply may have stopped after
                    partial deletion: inspect BMA logs and current inventory.'
              - stop: 'Retention failed or returned an invalid response. An apply may have stopped after partial
                  deletion: inspect BMA logs and current inventory.'
                error: true
          - if: '{{ plan.scope.get(''agent_ids'',[]) | sort != agent_ids | sort or plan.scope.get(''source_type'')
              != request.source_type or (job in [''full'',''partial''] and plan.scope.get(''job_id'') != job)
              }}'
            then:
              - action: script.bma_backup_notify
                data:
                  message: Retention response scope mismatch.
              - event: bma_backup_report
                event_data:
                  kind: operation
                  status: failed
                  message: Retention response scope mismatch.
              - stop: Retention response scope mismatch.
                error: true
          - if: '{{ operation == ''apply'' and (result.get(''execution'') is not mapping or result.execution.get(''deleted_count'')
              is not number or result.execution.get(''already_absent_count'') is not number) }}'
            then:
              - action: script.bma_backup_notify
                data:
                  message: Retention execution response is incomplete; inspect BMA logs.
              - event: bma_backup_report
                event_data:
                  kind: operation
                  status: failed
                  message: Retention execution response is incomplete; inspect BMA logs.
              - stop: Retention execution response is incomplete; inspect BMA logs.
                error: true
          - if: '{% set ns=namespace(bad=false) %}{% for key in [''considered'',''keep'',''delete'',''out_of_scope'',''reclaimable_size_bytes'']
              %}{% if plan.summary.get(key) is not number %}{% set ns.bad=true %}{% endif %}{% endfor %}{{
              ns.bad or plan.summary.get(''reclaimable_size_complete'') is not boolean }}'
            then:
              - action: script.bma_backup_notify
                data:
                  message: Retention summary is incomplete.
              - event: bma_backup_report
                event_data:
                  kind: operation
                  status: failed
                  message: Retention summary is incomplete.
              - stop: Retention summary is incomplete.
                error: true
          - event: bma_backup_report
            event_data:
              kind: retention
              operation: '{{ operation }}'
              job: '{{ job }}'
              evaluated_at: '{{ plan.evaluated_at }}'
              summary: '{{ plan.summary }}'
              scope: '{{ plan.scope }}'
              execution: '{{ result.get(''execution'', {}) if operation == ''apply'' else {} }}'
          - action: script.bma_backup_notify
            data:
              message: 'Retention {{ operation }} / {{ job }}: considered={{ plan.summary.considered }}, keep={{
                plan.summary.keep }}, delete={{ plan.summary.delete }}, out_of_scope={{ plan.summary.out_of_scope
                }}, reclaimable={{ plan.summary.reclaimable_size_bytes }} bytes (complete={{ plan.summary.reclaimable_size_complete
                }}). {% if operation == "apply" %}Verified deleted={{ result.execution.deleted_count }}, already
                absent={{ result.execution.already_absent_count }}.{% endif %}'
          - event: bma_backup_report
            event_data:
              kind: operation
              status: success
              message: '{{ "Retention " ~ operation ~ " completed: " ~ job }}'
automation:
  - id: bma_backup_startup
    alias: bma_backup_startup
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: script.bma_backup_initialize
      - event: bma_backup_report
        event_data:
          kind: operation
          status: idle
          message: Started; no previous operation is replayed. Inspect backups after an interrupted operation.
    mode: single
  - id: bma_backup_full_scheduler
    alias: bma_backup_full_scheduler
    triggers:
      - trigger: time
        at: input_datetime.bma_backup_full_time
    conditions:
      - condition: template
        value_template: |-
          {% set days = states('input_select.bma_backup_full_days') %}
          {{ is_state('input_boolean.bma_backup_full_enabled', 'on') and
          (days == 'Every day' or (days == 'Mon - Wed - Fri' and now().weekday() in [0,2,4]) or
          (days == 'Mon and Fri' and now().weekday() in [0,4]) or (days == 'Saturday' and now().weekday() == 5) or (days == 'Sunday' and now().weekday() == 6)) }}
    actions:
      - action: script.bma_backup_run_full
    mode: single
  - id: bma_backup_partial_scheduler
    alias: bma_backup_partial_scheduler
    triggers:
      - trigger: time
        at: input_datetime.bma_backup_partial_time
    conditions:
      - condition: template
        value_template: |-
          {% set days = states('input_select.bma_backup_partial_days') %}
          {{ is_state('input_boolean.bma_backup_partial_enabled', 'on') and
          (days == 'Every day' or (days == 'Mon - Wed - Fri' and now().weekday() in [0,2,4]) or
          (days == 'Mon and Fri' and now().weekday() in [0,4]) or (days == 'Saturday' and now().weekday() == 5) or (days == 'Sunday' and now().weekday() == 6)) }}
    actions:
      - action: script.bma_backup_run_partial
    mode: single
  - id: bma_backup_backup_created
    alias: bma_backup_backup_created
    mode: queued
    max: 20
    triggers:
      - trigger: event
        event_type: backup_manager_actions_backup_created
    conditions:
      - condition: template
        value_template: '{{ trigger.event.data.get(''backup_id'') is string and trigger.event.data.get(''agent_ids'')
          is sequence and trigger.event.data.get(''agent_ids'') is not string and trigger.event.data.get(''agent_ids'')
          | length > 0 and trigger.event.data.get(''failed_agent_ids'', [''invalid'']) == [] }}'
    actions:
      - variables:
          source: '{{ trigger.event.data.get(''source_type'',''unknown'') }}'
          job: '{{ trigger.event.data.get(''job_id'') if trigger.event.data.get(''source_type'') == ''bma''
            else trigger.event.data.get(''source_type'',''unknown'') }}'
      - if: '{{ (source == ''ha_native'' and is_state(''input_boolean.bma_backup_notify_external'',''on''))
          or (source == ''app_update'' and is_state(''input_boolean.bma_backup_notify_app_update'',''on''))
          or (source == ''unknown'' and is_state(''input_boolean.bma_backup_notify_unknown'',''on'')) }}'
        then:
          - action: script.bma_backup_notify
            data:
              message: 'External backup ({{ source }}): {{ trigger.event.data.get("name", "") }} | {{ trigger.event.data.get("date",
                "") }} | App: {{ trigger.event.data.get("app_slug", "") }} | Destinations: {{ trigger.event.data.agent_ids
                | join(", ") }}'
      - if: '{{ job in [''full'',''partial'',''ha_native'',''app_update''] and source in [''bma'',''ha_native'',''app_update'']
          and is_state(''input_boolean.bma_backup_'' ~ job ~ ''_retention_enabled'',''on'') and is_state(''input_boolean.bma_backup_apply_unlocked'',''on'')
          }}'
        then:
          - action: script.turn_on
            target:
              entity_id: script.bma_backup_worker
            data:
              variables:
                operation: apply
                job: '{{ job }}'
                automatic: true
                event_agents: '{{ trigger.event.data.agent_ids }}'
  - id: bma_backup_destination_health
    alias: bma_backup_destination_health
    triggers:
      - trigger: state
        entity_id: binary_sensor.bma_backup_required_destinations_ready
        from: 'on'
        to: 'off'
      - trigger: state
        entity_id: binary_sensor.bma_backup_required_destinations_ready
        from: 'off'
        to: 'on'
    actions:
      - action: script.bma_backup_notify
        data:
          message: Required backup destinations {{ "recovered" if trigger.to_state.state == "on" else "are
            unavailable or misconfigured" }}. Unselected destinations are excluded.
    mode: queued
    max: 5
template:
  - binary_sensor:
      - name: BMA Backup full destinations ready
        unique_id: bma_backup_full_destinations_ready
        default_entity_id: binary_sensor.bma_backup_full_destinations_ready
        state: |-
          {% set job='full' %}
          {% set ns=namespace(ids=[],bad=false) %}
          {% for item in states.input_boolean | selectattr('entity_id','match','^input_boolean.bma_backup_destination_' ~ job ~ '_') %}
          {% if item.state not in ['on','off'] %}{% set ns.bad=true %}{% elif item.state == 'on' %}
          {% set a=item.attributes.get('agent_id') %}{% if a is not string or not a | trim %}{% set ns.bad=true %}{% else %}{% set ns.ids=ns.ids+[a | trim] %}{% endif %}{% endif %}{% endfor %}
          {% set agents=state_attr('sensor.destinazioni_backup','agents') %}{% set errors=state_attr('sensor.destinazioni_backup','agent_errors') %}
          {{ has_value('sensor.destinazioni_backup') and agents is mapping and errors is mapping and not ns.bad and ns.ids | length > 0 and ns.ids | reject('in', agents) | list | length == 0 and ns.ids | select('in', errors) | list | length == 0 }}
      - name: BMA Backup partial destinations ready
        unique_id: bma_backup_partial_destinations_ready
        default_entity_id: binary_sensor.bma_backup_partial_destinations_ready
        state: |-
          {% set job='partial' %}
          {% set ns=namespace(ids=[],bad=false) %}
          {% for item in states.input_boolean | selectattr('entity_id','match','^input_boolean.bma_backup_destination_' ~ job ~ '_') %}
          {% if item.state not in ['on','off'] %}{% set ns.bad=true %}{% elif item.state == 'on' %}
          {% set a=item.attributes.get('agent_id') %}{% if a is not string or not a | trim %}{% set ns.bad=true %}{% else %}{% set ns.ids=ns.ids+[a | trim] %}{% endif %}{% endif %}{% endfor %}
          {% set agents=state_attr('sensor.destinazioni_backup','agents') %}{% set errors=state_attr('sensor.destinazioni_backup','agent_errors') %}
          {{ has_value('sensor.destinazioni_backup') and agents is mapping and errors is mapping and not ns.bad and ns.ids | length > 0 and ns.ids | reject('in', agents) | list | length == 0 and ns.ids | select('in', errors) | list | length == 0 }}
      - name: BMA Backup ha_native destinations ready
        unique_id: bma_backup_ha_native_destinations_ready
        default_entity_id: binary_sensor.bma_backup_ha_native_destinations_ready
        state: |-
          {% set job='ha_native' %}
          {% set ns=namespace(ids=[],bad=false) %}
          {% for item in states.input_boolean | selectattr('entity_id','match','^input_boolean.bma_backup_destination_' ~ job ~ '_') %}
          {% if item.state not in ['on','off'] %}{% set ns.bad=true %}{% elif item.state == 'on' %}
          {% set a=item.attributes.get('agent_id') %}{% if a is not string or not a | trim %}{% set ns.bad=true %}{% else %}{% set ns.ids=ns.ids+[a | trim] %}{% endif %}{% endif %}{% endfor %}
          {% set agents=state_attr('sensor.destinazioni_backup','agents') %}{% set errors=state_attr('sensor.destinazioni_backup','agent_errors') %}
          {{ has_value('sensor.destinazioni_backup') and agents is mapping and errors is mapping and not ns.bad and ns.ids | length > 0 and ns.ids | reject('in', agents) | list | length == 0 and ns.ids | select('in', errors) | list | length == 0 }}
      - name: BMA Backup app_update destinations ready
        unique_id: bma_backup_app_update_destinations_ready
        default_entity_id: binary_sensor.bma_backup_app_update_destinations_ready
        state: |-
          {% set job='app_update' %}
          {% set ns=namespace(ids=[],bad=false) %}
          {% for item in states.input_boolean | selectattr('entity_id','match','^input_boolean.bma_backup_destination_' ~ job ~ '_') %}
          {% if item.state not in ['on','off'] %}{% set ns.bad=true %}{% elif item.state == 'on' %}
          {% set a=item.attributes.get('agent_id') %}{% if a is not string or not a | trim %}{% set ns.bad=true %}{% else %}{% set ns.ids=ns.ids+[a | trim] %}{% endif %}{% endif %}{% endfor %}
          {% set agents=state_attr('sensor.destinazioni_backup','agents') %}{% set errors=state_attr('sensor.destinazioni_backup','agent_errors') %}
          {{ has_value('sensor.destinazioni_backup') and agents is mapping and errors is mapping and not ns.bad and ns.ids | length > 0 and ns.ids | reject('in', agents) | list | length == 0 and ns.ids | select('in', errors) | list | length == 0 }}
      - name: BMA Backup required destinations ready
        unique_id: bma_backup_required_destinations_ready
        default_entity_id: binary_sensor.bma_backup_required_destinations_ready
        state: |-
          {% set ns=namespace(ok=true) %}{% for job in ['full','partial','ha_native','app_update'] %}
          {% set active=is_state('input_boolean.bma_backup_' ~ job ~ '_enabled','on') or is_state('input_boolean.bma_backup_' ~ job ~ '_retention_enabled','on') %}
          {% if active and not is_state('binary_sensor.bma_backup_' ~ job ~ '_destinations_ready','on') %}{% set ns.ok=false %}{% endif %}{% endfor %}{{ ns.ok }}
  - triggers:
      - trigger: event
        event_type: bma_backup_report
        event_data:
          kind: operation
    sensor:
      - name: BMA Backup status
        default_entity_id: sensor.bma_backup_status
        unique_id: bma_backup_status
        state: '{{ trigger.event.data.status }}'
        attributes:
          message: '{{ trigger.event.data.message }}'
          updated_at: '{{ now().isoformat() }}'
  - triggers:
      - trigger: event
        event_type: bma_backup_report
        event_data:
          kind: retention
          operation: plan
    sensor:
      - name: BMA Backup Future Simulation (Dry Run)
        default_entity_id: sensor.bma_backup_retention_plan
        unique_id: bma_backup_retention_plan
        state: '{{ trigger.event.data.evaluated_at }}'
        attributes:
          job: '{{ trigger.event.data.job }}'
          summary: '{{ trigger.event.data.summary }}'
          scope: '{{ trigger.event.data.scope }}'
          execution: '{{ trigger.event.data.execution }}'
  - triggers:
      - trigger: event
        event_type: bma_backup_report
        event_data:
          kind: retention
          operation: apply
    sensor:
      - name: BMA Backup Last Actual Run
        default_entity_id: sensor.bma_backup_retention_apply
        unique_id: bma_backup_retention_apply
        state: '{{ trigger.event.data.evaluated_at }}'
        attributes:
          job: '{{ trigger.event.data.job }}'
          summary: '{{ trigger.event.data.summary }}'
          scope: '{{ trigger.event.data.scope }}'
          execution: '{{ trigger.event.data.execution }}'
